# Publish a release to PyPI when a GitHub Release is published.
#
# Uses PyPI trusted publishing (OIDC), so no API token is stored in GitHub.
# One-time setup is described in docs/development/releasing.md.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: "Where to publish"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distributions
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"

      - name: Check the tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          project=$(uv version --short)
          package=$(uv run --no-dev python -c "import mirrormax; print(mirrormax.__version__)")
          echo "tag=$TAG pyproject=$project __version__=$package"
          if [ "${TAG#v}" != "$project" ] || [ "$project" != "$package" ]; then
            echo "::error::Release tag ($TAG), pyproject.toml ($project) and mirrormax.__version__ ($package) must match."
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke-test the wheel
        run: uv run --isolated --no-project --with dist/*.whl mirrormax --version

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release' || inputs.repository == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mirrormax/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/mirrormax/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
